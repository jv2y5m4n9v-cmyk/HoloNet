name: Build HoloNet

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-14
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tk build support
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-venv
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.13"
      - name: Install build dependency (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv .build-venv
          ./.build-venv/bin/python -m pip install -r requirements-build.txt
      - name: Install build dependency (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m pip install -r requirements-build.txt
      - name: Build executable (Linux)
        if: runner.os == 'Linux'
        run: ./.build-venv/bin/python build.py
      - name: Build executable (Windows/macOS)
        if: runner.os != 'Linux'
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: HoloNet-${{ matrix.artifact }}
          path: dist/HoloNet*
          if-no-files-found: error
